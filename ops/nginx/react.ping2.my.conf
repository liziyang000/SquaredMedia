# Included by BaoTa from the react.ping2.my server block.
# MacCMS keeps ownership of PHP, player, uploads, and theme assets. Everything
# else is served by the loopback-only Next.js runtime.

location = /react-api.php {
    return 404;
}

location ^~ /preview/ {
    return 404;
}

location = /favicon.ico {
    alias /www/wwwroot/squaredMedia/template/pingfangvideo/images/brand/favicon.ico;
    expires 30d;
    access_log off;
}

location = /react-runtime/multiplayer-games.js {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}

location ~ ^/index\.php/user/(?:reg|findpass)(?:\.html)?(?:/.*)?$ {
    return 410;
}

location ~ "^/index\.php/vod/play/id/([1-9][0-9]{0,9})/sid/([1-9][0-9]{0,9})/nid/([1-9][0-9]{0,9})(?:\.html)?$" {
    error_page 418 = @legacy_play_next;
    if ($request_method = GET) {
        return 418;
    }
    if ($request_method = HEAD) {
        return 418;
    }
    root /www/wwwroot/squaredMedia;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $legacy_play_script_name $fastcgi_script_name;
    set $legacy_play_path_info $fastcgi_path_info;
    try_files $legacy_play_script_name =404;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_intercept_errors off;
    fastcgi_index index.php;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$legacy_play_script_name;
    fastcgi_param SCRIPT_NAME $legacy_play_script_name;
    fastcgi_param PATH_INFO $legacy_play_path_info;
}

location ~ "^/vodplay/([1-9][0-9]{0,9})-([1-9][0-9]{0,9})-([1-9][0-9]{0,9})\.html$" {
    error_page 418 = @legacy_play_next;
    if ($request_method = GET) {
        return 418;
    }
    if ($request_method = HEAD) {
        return 418;
    }
    rewrite "^/vodplay/([1-9][0-9]{0,9})-([1-9][0-9]{0,9})-([1-9][0-9]{0,9})\.html$" /index.php/vod/play/id/$1/sid/$2/nid/$3.html last;
}

location @legacy_play_next {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location ~ "^/index\.php/label/(?:games|game-2048|game-blockrain|game-gomoku|game-drawguess)(?:\.html)?$" {
    error_page 418 = @legacy_play_next;
    if ($request_method = GET) {
        return 418;
    }
    if ($request_method = HEAD) {
        return 418;
    }
    root /www/wwwroot/squaredMedia;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $legacy_game_script_name $fastcgi_script_name;
    set $legacy_game_path_info $fastcgi_path_info;
    try_files $legacy_game_script_name =404;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_intercept_errors off;
    fastcgi_index index.php;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$legacy_game_script_name;
    fastcgi_param SCRIPT_NAME $legacy_game_script_name;
    fastcgi_param PATH_INFO $legacy_game_path_info;
}

location ~ ^/index\.php(?:/|$) {
    root /www/wwwroot/squaredMedia;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $index_script_name $fastcgi_script_name;
    set $index_path_info $fastcgi_path_info;
    try_files $index_script_name =404;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_intercept_errors off;
    fastcgi_index index.php;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$index_script_name;
    fastcgi_param SCRIPT_NAME $index_script_name;
    fastcgi_param PATH_INFO $index_path_info;
}

location ~ ^/api\.php(?:/|$) {
    root /www/wwwroot/squaredMedia;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $api_script_name $fastcgi_script_name;
    set $api_path_info $fastcgi_path_info;
    try_files $api_script_name =404;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_index api.php;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$api_script_name;
    fastcgi_param SCRIPT_NAME $api_script_name;
    fastcgi_param PATH_INFO $api_path_info;
}

location = /game-socket {
    if ($request_method != GET) {
        return 405;
    }
    if ($http_origin != "https://react.ping2.my") {
        return 403;
    }
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host www.ping2video.xyz;
    proxy_set_header Origin https://www.ping2video.xyz;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

location = /static/player/artplayer/api.php {
    root /www/wwwroot/squaredMedia;
    try_files /static/player/artplayer/api.php =404;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_index api.php;
    include fastcgi.conf;
}

location ^~ /upload/ {
    root /www/wwwroot/squaredMedia;
    if ($uri ~* \.php(?:/|$)) { return 404; }
    try_files $uri =404;
    expires 30d;
}

location ^~ /static/ {
    root /www/wwwroot/squaredMedia;
    if ($uri ~* \.php(?:/|$)) { return 404; }
    try_files $uri =404;
    expires 30d;
}

location ^~ /template/ {
    root /www/wwwroot/squaredMedia;
    if ($uri ~* \.php(?:/|$)) { return 404; }
    try_files $uri =404;
    expires 30d;
}

location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
}
